# Package and release the plugin when a version tag is pushed.
# Push a tag matching manifest.json's version (e.g. v1.2.0) and this builds
# the bundle, zips manifest.json + the manifest-declared files, creates the
# GitHub release with the zip attached, and puts the sha256 plus a
# ready-to-paste marketplace registration snippet in the release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # npm install runs every dependency's install scripts, so this job holds no
  # write permission. It hands the finished zip to the release job, which
  # installs nothing.
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Package
        run: |
          id=$(node -p "require('./manifest.json').id")
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json version is $version but the tag is $GITHUB_REF_NAME; bump one to match" >&2
            exit 1
          fi
          files=$(node -p "(require('./manifest.json').files ?? ['main.js']).join(' ')")
          mkdir out
          zip -X -q "out/$id.zip" manifest.json $files
          cp manifest.json out/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package
          path: out
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(node -p "require('./manifest.json').id")
          version=$(node -p "require('./manifest.json').version")
          sha256=$(sha256sum "$id.zip" | cut -d' ' -f1)
          export URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$id.zip"
          export SHA256="$sha256"
          {
            echo "sha256: \`$sha256\`"
            echo
            echo "To list this release on the [Glyph marketplace](https://github.com/glyph-md/plugins), open a PR adding \`plugins/$id/plugin.json\` (plus a \`README.md\`):"
            echo
            echo '```json'
            node -e "
              const m = require('./manifest.json');
              console.log(JSON.stringify({
                id: m.id,
                name: m.name,
                version: m.version,
                description: m.description,
                category: 'tools',
                packageUrl: process.env.URL,
                sha256: process.env.SHA256,
              }, null, 2));
            "
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$id v$version" --notes-file notes.md "$id.zip"
